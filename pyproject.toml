[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flasd"
version = "0.1.0"
description = "FDL-ASD: federated LoRA Arabic sarcasm detection"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.1.0",
  "transformers>=4.46.0",
  "peft>=0.18.0",
  "accelerate>=0.30.0",
  "numpy>=1.24",
  "pandas>=2.0",
  "scikit-learn>=1.3",
  "scipy>=1.10",
  "tqdm>=4.66",
]

[tool.setuptools.packages.find]
where = ["src"]
